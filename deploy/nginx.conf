server {
    listen 80;
    # Замените IP на ваш домен, когда привяжете его (например: server_name moroz314.ru www.moroz314.ru;)
    server_name 136.234.4.160;

    root /var/www/moroz314/dist;
    index index.html;

    # Gzip сжатие для быстрой загрузки
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Кэширование статики (JS/CSS/картинки)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Проксирование заявок в Telegram на локальный Node-сервер
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA роутинг (React Router: /demo/detailing, /demo/furniture, /demo/coffee)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
